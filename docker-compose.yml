services:
  nexus:
    image: nexus-okta-auth-plugin:${NEXUS_OKTA_IMAGE_TAG:-local-arm64}
    platform: ${NEXUS_PLATFORM:-linux/arm64}
    container_name: nexus-okta-auth-plugin
    ports:
      - "${NEXUS_HTTP_PORT:-18081}:8081"
    env_file:
      - ${NEXUS_ENV_FILE:-.env.local}
    volumes:
      - nexus-okta-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  nexus-okta-data:
